detector_3d:
  ros__parameters:
    marker_map_file:     package://aist_aruco_ros/config/aruco-100_101_102_103-105x105-7.yaml
    marker_size:         0.105            # Effective only if marker_map == ""
    marker_frame:        marker_frame
    image_is_rectified:  false
    use_similarity:      false
    planarity_tolerance: 0.001
#    min_marker_size:     -1.0
    enclosed_marker:     true
    detection_mode:      1        # 0: DM_NORMAL, 1: DM_FAST, 2: DM_VIDEO_FAST
    dictionary:          ARUCO

/**:
  ros__parameters:
    reference_frame:     workspace_center
    end_effector_link:   b_bot_gripper_base_link
    eye_on_hand:         true

handeye_calibrator:
  ros__parameters:
    pose_timeout:        3.0
    use_dual_quaternion: true

handeye_calibration:
  ros__parameters:
    camera_name:         b_bot_camera
    robot_name:          b_bot
    calibration_file:    package://aist_description/scenes/calib/b_bot_camera.yaml
    speed:               1.0
    settling_time:       2.0
    initpose:            [-0.145,  0.00, 0.50, 90.0,  90.0,   0.0]
    keyposes:            [-0.295, -0.02, 0.40, 90.0,  60.0,   0.0,
                          -0.195, -0.02, 0.40, 90.0,  75.0,   0.0,
                          -0.145, -0.02, 0.40, 90.0,  90.0,   0.0,
                          -0.095, -0.02, 0.40, 90.0, 105.0,   0.0,
                           0.005, -0.02, 0.40, 90.0, 120.0,   0.0,
                          -0.145,  0.13, 0.40,  0.0,  50.0, -90.0,
                          -0.145,  0.08, 0.40,  0.0,  65.0, -90.0,
                          -0.145, -0.04, 0.40,  0.0,  95.0, -90.0,
                          -0.145, -0.08, 0.40,  0.0, 110.0, -90.0]
