detector_3d:
  ros__parameters:
    marker_map_file:     package://aist_aruco_ros/config/aruco-100_101_102_103-105x105-7.yaml
    marker_size:         0.105            # Effective only if marker_map == ""
    marker_frame:        marker_frame
    image_is_rectified:  false
    use_similarity:      false
    planarity_tolerance: 0.001
#    min_marker_size:     -1.0
    enclosed_marker:     true
    detection_mode:      1        # 0: DM_NORMAL, 1: DM_FAST, 2: DM_VIDEO_FAST
    dictionary:          ARUCO

/**:
  ros__parameters:
    reference_frame:     workspace_center
    end_effector_link:   a_bot_gripper_base_link
    eye_on_hand:         true

handeye_calibrator:
  ros__parameters:
    pose_timeout:        3.0
    use_dual_quaternion: true

handeye_calibration:
  ros__parameters:
    camera_name:         a_bot_camera
    robot_name:          a_bot
    calibration_file:    package://aist_description/scenes/calib/a_bot_camera.yaml
    speed:               1.0
    settling_time:       2.0
    initpose:            [-0.145,  0.00, 0.60,  -90.0,  90.0,   0.0]
    keyposes:            [-0.290,  0.00, 0.45,  -90.0,  60.0,   0.0,
                          -0.215,  0.00, 0.45,  -90.0,  75.0,   0.0,
                          -0.145,  0.00, 0.45,  -90.0,  90.0,   0.0,
                          -0.075,  0.00, 0.45,  -90.0, 105.0,   0.0,
                           0.000,  0.00, 0.45,  -90.0, 120.0,   0.0,
                          -0.145,  0.17, 0.45, -180.0,  60.0, -90.0,
                          -0.145,  0.07, 0.45, -180.0,  75.0, -90.0,
                          -0.145, -0.09, 0.45, -180.0, 110.0, -90.0,
                          -0.145, -0.20, 0.45, -180.0, 125.0, -90.0]
